[package]
name = "mdvr"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Read-only macOS Markdown viewer"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
block = "=0.1.6"
cocoa = "=0.26.0"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
objc = "=0.2.7"
raw-window-handle = "=0.6.2"
