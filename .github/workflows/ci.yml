name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun test tests
        working-directory: web
      - run: bun scripts/verify/generate-notices.mjs && git diff --exit-code THIRD_PARTY_NOTICES.md
      - run: bun run build
        working-directory: web
      - run: swift scripts/verify/check-renderer.swift web/dist/index.html
      - run: sh scripts/verify/check-fixtures.sh
